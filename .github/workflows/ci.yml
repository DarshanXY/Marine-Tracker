name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs on new push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: lint + type-check + test + build ────────
  frontend:
    name: Frontend (lint · types · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test -- --run --reporter=verbose

      - name: Build
        run: npm run build

  # ── Backend: lint + type-check + test ────────────────
  backend:
    name: Backend (lint · types · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

  # ── Python engine: ruff lint + format + pytest ────────
  python-engine:
    name: Python Engine (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python_engine/requirements.txt

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No tests directory yet — skipping"
          fi

  # ── Docker compose smoke test ─────────────────────────
  # (Only on push to main/develop — avoids burning minutes on every PR)
  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [frontend, backend, python-engine]

    steps:
      - uses: actions/checkout@v4

      - name: Copy env template
        run: cp .env.example .env

      - name: Build images
        run: docker compose build --parallel

      - name: Start infrastructure only (postgres + redis)
        run: |
          docker compose up -d postgres redis
          sleep 15

      - name: Check postgres health
        run: docker compose exec -T postgres pg_isready -U mpt_user -d marine_plastic

      - name: Check redis health
        run: docker compose exec -T redis redis-cli -a mpt_redis_dev ping

      - name: Tear down
        if: always()
        run: docker compose down -v
