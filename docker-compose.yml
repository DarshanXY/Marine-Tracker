version: '3.9'

# ═══════════════════════════════════════════════════════
# Marine Plastic Tracker
# Local dev stack: PostgreSQL+PostGIS, Redis, backend, python-engine, frontend
# Run: docker-compose up --build
# ═══════════════════════════════════════════════════════

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: mpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-mpt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpt_dev_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-marine_plastic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpt_user} -d ${POSTGRES_DB:-marine_plastic}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (BullMQ job queue) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mpt_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-mpt_redis_dev} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mpt_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js / Express backend ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mpt_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:     development
      DATABASE_URL: postgresql://${POSTGRES_USER:-mpt_user}:${POSTGRES_PASSWORD:-mpt_dev_pass}@postgres:5432/${POSTGRES_DB:-marine_plastic}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-mpt_redis_dev}@redis:6379
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Python FastAPI compute engine ─────────────────────
  python-engine:
    build:
      context: ./python_engine
      dockerfile: Dockerfile.dev
    container_name: mpt_python_engine
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mpt_user}:${POSTGRES_PASSWORD:-mpt_dev_pass}@postgres:5432/${POSTGRES_DB:-marine_plastic}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-mpt_redis_dev}@redis:6379
      DEMO_MODE:    ${DEMO_MODE:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./python_engine:/app
      - ./data:/app/data
      - ./python_engine/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── React / Vite frontend ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mpt_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL:           http://localhost:3001
      VITE_PYTHON_ENGINE_URL: http://localhost:8000
      VITE_DEMO_MODE:         ${DEMO_MODE:-true}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
